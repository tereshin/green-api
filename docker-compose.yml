name: green-api

services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in the server .env}
    image: green-api:latest
    container_name: green-api
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-web}
